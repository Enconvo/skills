<!doctype html>
<!--
  Reusable HyperFrames composition template for a Finance & Capital Markets video ACT.
  Replace ALL {{...}} placeholders before render.
  Aesthetic: v4.2 — transparent overlay (broadcast-graphics-on-the-plate),
  per-card frosted glass, champagne-ivory emphasis, floating glass chyron bug,
  gold ticker, stamped-seal alert callouts. No pinks, no red gradients.
  Locked architecture: anchor base full-frame + right-42% transparent overlay column + floating chyron bug.
  Palette: ink + champagne ivory + gold. Fonts: Fraunces (Latin), Noto Sans/Serif SC (CJK), JetBrains Mono.
  Provide an ACT-length anchor mp4 named {{ANCHOR_FILE}} (default `actN_anchor.mp4`) in the same dir.
-->
<html>
<head>
<meta charset="utf-8" />
<title>{{ACT_TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:    #fff7e6;
    --paper-2:  #f3e7c8;
    --ink:      #0a0807;
    --ink-2:    #16110b;
    --ink-soft: rgba(255,247,230,0.72);
    --ink-mute: rgba(255,247,230,0.45);
    --gold:     #ffd668;
    --gold-2:   #f7c844;
    --gold-3:   #c9962f;
    --oxblood:  #e63f4a;            /* reserved alert-extreme only; not used by default */
    --accent-bright: #fff4c4;        /* champagne ivory — emphasis text + glows */
    --accent-glow:   rgba(255,244,196,0.55);
    --green:    #4cd16b;
    /* legacy alias kept so older scenes that reference --oxblood-2 still inherit champagne ivory */
    --oxblood-2: #fff4c4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #000;
    font-family: 'Noto Sans SC', 'PingFang SC', 'Helvetica Neue', sans-serif;
    color: var(--paper);
  }
  [data-composition-id="root"] {
    position: relative; width: 100%; height: 100%; overflow: hidden;
  }
  .anchor-base {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }

  /* ===== v4.2: right 42% overlay column is FULLY TRANSPARENT.
     Per-card frosted glass cards carry the structure, not a panel scrim. */
  .panel {
    position: absolute; top: 0; right: 0; width: 42%; height: 100%;
    padding: 60px 56px 60px 68px;
    display: flex; flex-direction: column; justify-content: center; gap: 30px;
    overflow: hidden;
    background: transparent;
    box-shadow: none;
  }
  .panel .shimmer {
    position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 38%, rgba(255,214,104,0.28) 50%, transparent 62%);
    transform: translateX(-110%); pointer-events: none; z-index: 5;
  }

  .kicker-cn {
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    font-size: 26px; font-weight: 700; color: var(--gold);
    letter-spacing: 0.34em;
    text-shadow: 0 0 18px rgba(255,214,104,0.45), 0 0 6px rgba(0,0,0,0.55);
  }
  .gold-rule {
    height: 5px; width: 110px;
    background: linear-gradient(90deg, var(--gold), var(--gold-3));
    border-radius: 3px; box-shadow: 0 0 20px rgba(255,214,104,0.55);
  }
  .number {
    font-family: 'Fraunces', 'Noto Serif SC', serif;
    font-weight: 700; font-feature-settings: 'tnum' 1, 'lnum' 1;
    color: var(--paper); line-height: 0.9; letter-spacing: -0.03em;
    /* Heavy black halo so hero numbers stay legible without a panel scrim. */
    text-shadow: 0 0 38px rgba(0,0,0,0.92), 0 0 64px rgba(0,0,0,0.55), 0 0 22px rgba(255,247,230,0.32);
  }
  .number .unit {
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    font-weight: 700; font-size: 0.38em; color: var(--gold);
    letter-spacing: 0.04em; margin-left: 10px; vertical-align: 0.42em;
    text-shadow: 0 0 14px rgba(255,214,104,0.55), 0 0 6px rgba(0,0,0,0.7);
  }
  .label {
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    font-size: 24px; font-weight: 500; color: var(--ink-soft);
    letter-spacing: 0.22em;
    text-shadow: 0 0 12px rgba(0,0,0,0.65);
  }
  .stat-row { display: flex; flex-direction: column; gap: 8px; }

  /* Hero number scene */
  .panel.scene-hero .number-big { font-size: 150px; }
  .panel.scene-hero .number-big.accent {
    color: var(--accent-bright);
    text-shadow: 0 0 38px rgba(0,0,0,0.92), 0 0 64px rgba(0,0,0,0.6), 0 0 26px var(--accent-glow);
  }

  /* ===== Frosted-glass card (replaces all panel-scrim cards). ===== */
  .card {
    position: relative; padding: 26px 30px;
    background: rgba(10,8,7,0.42);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-left: 4px solid var(--gold);
    display: flex; flex-direction: column; gap: 10px;
    border-radius: 0 6px 6px 0;
    box-shadow: 0 10px 38px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,214,104,0.24);
  }
  .card-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px; color: var(--gold);
    letter-spacing: 0.34em; font-weight: 700;
  }
  .card-title {
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    font-size: 40px; font-weight: 800; color: var(--paper);
    line-height: 1.18; letter-spacing: 0.04em;
    text-shadow: 0 0 28px rgba(255,247,230,0.25), 0 0 6px rgba(0,0,0,0.55);
  }
  .verdict {
    margin-top: 12px; padding: 22px 26px;
    background: linear-gradient(90deg, rgba(255,214,104,0.18), rgba(247,200,68,0.32));
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 2px solid var(--gold); border-radius: 4px;
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    font-size: 30px; font-weight: 800; color: var(--paper);
    letter-spacing: 0.06em; text-align: center;
    box-shadow: 0 0 30px rgba(255,214,104,0.28);
  }
  .verdict strong {
    color: var(--accent-bright); font-weight: 900;
    text-shadow: 0 0 18px var(--accent-glow), 0 0 6px rgba(0,0,0,0.65);
  }

  /* Fact list scene */
  .fact-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 22px; }
  .fact {
    display: flex; align-items: center; gap: 22px;
    padding: 22px 26px;
    background: rgba(10,8,7,0.42);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-left: 4px solid var(--gold); border-radius: 0 6px 6px 0;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,214,104,0.20);
  }
  .fact-num {
    font-family: 'Fraunces', serif; font-size: 48px;
    color: var(--gold); font-weight: 700; flex-shrink: 0;
    width: 64px; line-height: 1;
    text-shadow: 0 0 22px rgba(255,214,104,0.5);
  }
  .fact-text {
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    font-size: 30px; font-weight: 700; color: var(--paper);
    line-height: 1.3; letter-spacing: 0.04em;
    text-shadow: 0 0 6px rgba(0,0,0,0.6);
  }
  /* emphasis inside fact-text — champagne ivory, never pink. */
  .fact-text em {
    font-style: normal; color: var(--accent-bright);
    text-shadow: 0 0 22px var(--accent-glow), 0 0 10px rgba(0,0,0,0.7);
  }

  /* ===== Ticker dot (use for LIVE / EXCHANGE markers). GOLD, never red. ===== */
  .ticker-row { display: flex; align-items: center; gap: 16px; }
  .ticker-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 5px rgba(255,214,104,0.22), 0 0 24px rgba(255,214,104,0.85), 0 0 8px rgba(0,0,0,0.6);
  }
  .ticker-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px; font-weight: 700; color: var(--paper);
    letter-spacing: 0.16em;
    text-shadow: 0 0 6px rgba(0,0,0,0.7);
  }

  /* ===== Stamped editorial seal — replaces ALL red/pink alert gradients.
     Use for warnings, traps, and "watch this" calls. Premium, not panic. ===== */
  .seal {
    position: relative;
    margin-top: 10px; padding: 22px 26px;
    background: linear-gradient(90deg, rgba(10,8,7,0.78) 0%, rgba(22,17,11,0.82) 50%, rgba(10,8,7,0.78) 100%);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: var(--gold);
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    font-weight: 800; font-size: 26px;
    letter-spacing: 0.32em; text-align: center;
    border-radius: 2px;
    box-shadow:
      0 12px 44px rgba(0,0,0,0.65),
      0 0 0 1px var(--gold),
      inset 0 0 0 5px rgba(10,8,7,0.0),
      inset 0 0 0 6px rgba(255,214,104,0.55);
    text-shadow: 0 0 18px rgba(255,214,104,0.5), 0 0 6px rgba(0,0,0,0.7);
  }

  /* ===== Floating glass chyron bug — compact, anchored bottom-left. ===== */
  .chyron {
    position: absolute; left: 40px; bottom: 36px;
    padding: 12px 24px;
    background: rgba(10,8,7,0.42);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-left: 3px solid var(--gold);
    border-radius: 0 4px 4px 0;
    box-shadow: 0 8px 28px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,214,104,0.22);
    display: flex; align-items: baseline; gap: 18px;
  }
  .chyron .agent {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 28px;
    color: var(--paper); letter-spacing: 0.02em;
    text-shadow: 0 0 14px rgba(255,247,230,0.4);
  }
  .chyron .sep {
    width: 2px; height: 20px; background: var(--gold);
    box-shadow: 0 0 12px rgba(255,214,104,0.55);
  }
  .chyron .role {
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    font-size: 17px; font-weight: 700; color: var(--gold);
    letter-spacing: 0.22em;
  }
  .chyron .progress {
    margin-left: 6px; padding-left: 16px;
    border-left: 1px solid rgba(255,214,104,0.32);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; color: var(--gold); letter-spacing: 0.26em;
  }
</style>
</head>
<body>
<div data-composition-id="root" data-start="0" data-width="1280" data-height="720">

  <!-- Anchor base video + audio (full ACT duration). Replace src + data-duration. -->
  <video class="anchor-base" id="anchor-v" data-start="0" data-duration="{{ACT_DURATION}}" data-track-index="0" src="{{ANCHOR_FILE}}" muted playsinline></video>
  <audio id="anchor-a" data-start="0" data-duration="{{ACT_DURATION}}" data-track-index="1" src="{{ANCHOR_FILE}}" data-volume="1"></audio>

  <!-- Persistent floating-glass chyron bug -->
  <div class="chyron clip" id="chyron" data-start="0" data-duration="{{ACT_DURATION}}" data-track-index="2">
    <span class="agent">{{AGENT_NAME}}</span>
    <span class="sep"></span>
    <span class="role">{{VIDEO_TITLE}}</span>
    <span class="progress">ACT {{ACT_NUMBER}} / {{TOTAL_ACTS}}</span>
  </div>

  <!--
    Add one .panel div per scene below. Each scene:
      - unique id (#s1, #s2, ...)
      - data-start (seconds from ACT start)
      - data-duration (seconds, usually 10)
      - data-track-index="3"
      - <span class="shimmer"></span> child  (NO vignette anymore — overlay is transparent)
      - the scene's content (kicker, gold-rule, hero/cards/facts/seal)
    Then add matching GSAP entrances + pulses in the <script> below.
    Refer to references/hf-composition.md for the animation library (v4.2).
  -->

  <!-- EXAMPLE: hero-number scene 0–10s -->
  <div class="panel scene-hero clip" id="s1" data-start="0" data-duration="10" data-track-index="3">
    <span class="shimmer"></span>
    <div class="ticker-row">
      <span class="ticker-dot"></span>
      <span class="ticker-text">{{S1_TICKER}}</span>
    </div>
    <div class="gold-rule"></div>
    <div class="stat-row">
      <span class="label">{{S1_LABEL}}</span>
      <span class="number number-big"><span>$</span><span class="counter" data-target="{{S1_TARGET}}">0</span><span class="unit">{{S1_UNIT}}</span></span>
    </div>
    <div class="seal">{{S1_SEAL}}</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    function counter(selector, atTime, dur, target, decimals) {
      const obj = { v: 0 };
      tl.to(obj, {
        v: target, duration: dur, ease: 'power2.out',
        onUpdate: () => {
          const el = document.querySelector(selector);
          if (el) el.textContent = decimals ? obj.v.toFixed(decimals) : Math.round(obj.v);
        }
      }, atTime);
    }
    function shimmer(scopeSel, atTime) {
      tl.fromTo(scopeSel + ' .shimmer',
        { x: '-110%' },
        { x: '110%', duration: 1.6, ease: 'power2.inOut' }, atTime);
    }

    // Chyron entrance
    tl.from('#chyron .agent',    { y: 30, opacity: 0, duration: 0.7, ease: 'power3.out' }, 0.2);
    tl.from('#chyron .sep',      { scaleY: 0, opacity: 0, duration: 0.45, ease: 'power2.out', transformOrigin: 'bottom' }, 0.6);
    tl.from('#chyron .role',     { x: -24, opacity: 0, duration: 0.6, ease: 'expo.out' }, 0.7);
    tl.from('#chyron .progress', { x: 24, opacity: 0, duration: 0.5, ease: 'expo.out' }, 0.9);

    // EXAMPLE Scene 1 timeline
    tl.from('#s1', { x: 100, opacity: 0, duration: 0.8, ease: 'expo.out' }, 0.2);
    shimmer('#s1', 1.4);
    tl.from('#s1 .ticker-dot', { scale: 0, opacity: 0, duration: 0.5, ease: 'back.out(2)' }, 0.7);
    tl.to('#s1 .ticker-dot', { scale: 1.35, duration: 0.45, ease: 'sine.inOut', yoyo: true, repeat: 11, overwrite: 'auto' }, 1.4);
    tl.from('#s1 .ticker-text', { x: 30, opacity: 0, duration: 0.55, ease: 'power3.out' }, 0.9);
    tl.from('#s1 .gold-rule', { scaleX: 0, transformOrigin: 'left center', duration: 0.5, ease: 'power2.out' }, 1.0);
    tl.from('#s1 .label', { y: 22, opacity: 0, duration: 0.5, ease: 'power3.out' }, 1.6);
    tl.from('#s1 .number-big', { y: 50, scale: 0.7, opacity: 0, duration: 0.7, ease: 'expo.out' }, 1.9);
    counter('#s1 .number-big .counter', 1.9, 1.6, {{S1_TARGET}}, 0);
    tl.to('#s1 .number-big', { scale: 1.06, duration: 0.28, ease: 'power2.out', yoyo: true, repeat: 1 }, 3.6);
    tl.fromTo('#s1 .number-big',
      { textShadow: '0 0 38px rgba(0,0,0,0.92), 0 0 22px rgba(255,247,230,0.32)' },
      { textShadow: '0 0 38px rgba(0,0,0,0.92), 0 0 60px rgba(255,247,230,0.85)',
        duration: 0.35, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 3.65);

    // Stamped-seal callout — gold ring flash, not red flash.
    tl.from('#s1 .seal', { scale: 0.6, opacity: 0, duration: 0.75, ease: 'back.out(1.9)' }, 7.4);
    tl.fromTo('#s1 .seal',
      { boxShadow: '0 12px 44px rgba(0,0,0,0.65), 0 0 0 1px #ffd668, inset 0 0 0 5px rgba(10,8,7,0), inset 0 0 0 6px rgba(255,214,104,0.55)' },
      { boxShadow: '0 12px 44px rgba(0,0,0,0.65), 0 0 0 1px #ffd668, 0 0 56px rgba(255,214,104,0.7), inset 0 0 0 5px rgba(10,8,7,0), inset 0 0 0 6px rgba(255,214,104,0.95)',
        duration: 0.4, yoyo: true, repeat: 1, ease: 'power2.out' }, 8.3);

    window.__timelines['root'] = tl;
  </script>
</div>
</body>
</html>
